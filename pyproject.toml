[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "florence2-sam-demo"
version = "0.1.0"
description = "Florence-2 + SAM image recognition pipeline with Gradio UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.38.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "gradio>=4.0.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "einops>=0.7.0",
    "timm>=0.9.0",
    "supervision>=0.18.0",
]

[project.scripts]
florence2-sam-demo = "app:main"
